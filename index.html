<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title> Góc chill của Trường </title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    height: 100vh;
    color: #fff;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
/* Background blur */
.bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(90px) brightness(0.35) saturate(1.3);
    transform: scale(1.25);
    z-index: -2;
    transition: background-image 0.6s ease;
}
.bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.85) 100%);
    z-index: -1;
}
/* Navbar */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: rgba(8, 8, 12, 0.85);
    backdrop-filter: blur(24px);
    border-bottom: 1px solid rgba(255, 77, 77, 0.3);
    display: flex;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
    gap: 16px;
}
.logo {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #ff4d4d, #ff9494);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.title-nav {
    font-size: 16px;
    opacity: 0.8;
    font-weight: 500;
}
.btn {
    background: rgba(255, 77, 77, 0.12);
    border: 1px solid rgba(255, 77, 77, 0.4);
    color: white;
    border-radius: 40px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}
.btn:hover {
    background: #ff4d4d;
    border-color: #ff4d4d;
    transform: scale(1.02);
}
/* Container */
.container {
    display: flex;
    max-width: 1600px;
    margin: 0 auto;
    height: 100vh;
    padding: 80px 24px 24px;
    gap: 24px;
}
/* LEFT - video area + FILL THE GAP under video */
.left {
    flex: 2.2;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
}
.player-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    background: #000;
}
.info-area {
    padding: 0 6px;
}
.main-title {
    font-size: clamp(20px, 2.5vw, 28px);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.signature {
    font-size: 12px;
    color: #ff8a8a;
    letter-spacing: 1px;
    opacity: 0.7;
}
/* RIGHT - Playlist */
.right {
    flex: 1.35;
    min-width: 340px;
    height:100%;
    background: rgba(20, 20, 28, 0.55);
    backdrop-filter: blur(24px);
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.playlist-header {
    padding: 18px 22px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
}
.playlist-header::before {
    content: '';
    width: 6px;
    height: 6px;
    background: #ff4d4d;
    border-radius: 50%;
}
/* Thanh cuộn đẹp cho list nhạc (yêu cầu số 1) */
#list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 8px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
#list::-webkit-scrollbar {
    width: 5px;
}
#list::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
}
#list::-webkit-scrollbar-thumb {
    background: #ff4d4d;
    border-radius: 10px;
}
#list {
    scrollbar-width: thin;
    scrollbar-color: #ff4d4d rgba(255,255,255,0.1);
}
.item {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 16px;
    background: rgba(10,10,14,0.3);
    border: 1px solid transparent;
}
.item:hover {
    background: rgba(255, 77, 77, 0.15);
    transform: translateX(4px);
}
.item.active {
    background: linear-gradient(95deg, rgba(255,77,77,0.25), rgba(255,100,100,0.1));
    border-left: 3px solid #ff4d4d;
}
.thumb {
    width: 100px;
    height: 60px;
    border-radius: 12px;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
}
.controls {
    padding: 14px 20px 20px;
    border-top: 1px solid rgba(255,255,255,0.07);
}
.controls .btn {
    width: 100%;
    padding: 10px;
}
/* Responsive */
@media (max-width: 768px) {
    body {
        overflow-y: auto;
    }
    .container {
        flex-direction: column;
        height: auto;
        padding: 75px 16px 20px;
    }
    .right {
        width: 100%;
        max-height: 420px;
    }
    .gap-filler {
        min-height: 180px;
    }
    .thumb {
        width: 80px;
        height: 48px;
    }
}
</style>
</head>
<body>
<div id="bg" class="bg"></div>
<nav class="navbar">
    <div class="logo">SCHOOL2K3</div>
    <div class="title-nav">Chill Player</div>
    <div style="margin-left:auto">
        <button class="btn" onclick="nextRandom()">🎲 Random</button>
    </div>
</nav>
<div class="container">
    <!-- LEFT: Video + info + KHOẢNG TRỐNG ĐƯỢC LẤP ĐẦY BẰNG "SẮP PHÁT" -->
    <div class="left">
        <div id="player" class="player-frame"></div>
        <div class="info-area">
            <div id="title" class="main-title">Loading...</div>
            <div class="signature">SCHOOL2K3 • PRIVATE CHILL SPACE</div>
        </div>
    </div>
    <!-- RIGHT: Playlist có thanh cuộn đẹp -->
    <div class="right">
        <div class="playlist-header">
            📀 Danh sách phát • Chill Vibes
        </div>
        <div id="list"></div>
        <div class="controls">
            <button class="btn" onclick="nextRandom()">🎲 Phát ngẫu nhiên tiếp theo</button>
        </div>
    </div>
</div>
<script>
const videos = [
    "6hNenqz0ISA", "5aU6EXel1Cs", "jPjQJYKhhk4", "2g2QOisCvhs",
    "b56j7WvwaYM", "T7ksmtaVeOk", "X5Ra4S4B96U", "umMQf9spwMw",
    "IDafZe9nQ-8", "y3o7Dg9Ikpc", "gOtfJ151ue4", "o1dVTgUa_HA",
    "scVfZ4Evhuo", "XX248bq6Pw"
];
let player;
let titlesCache = {};
// Render playlist bên phải
function renderList() {
    let html = "";
    videos.forEach((id, i) => {
        html += `
        <div class="item ${i===0?'active':''}" onclick="playVideo(${i})" id="item-${i}">
            <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${id}/hqdefault.jpg')"></div>
            <div style="flex:1">
                <div id="title-${i}" style="font-size:14px; font-weight:500; margin-bottom:4px;">Loading...</div>
                <div style="font-size:11px; opacity:0.6;">School2k3</div>
            </div>
        </div>`;
    });
    document.getElementById("list").innerHTML = html;
}
async function loadTitles() {
    for (let i = 0; i < videos.length; i++) {
        const id = videos[i];
        try {
            const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`);
            const data = await res.json();
            let songTitle = data.title || `Chill track ${i+1}`;
            if (songTitle.length > 50) songTitle = songTitle.substring(0,47)+"...";
            titlesCache[i] = songTitle;
            const titleEl = document.getElementById(`title-${i}`);
            if (titleEl) titleEl.innerText = songTitle;
            if (i === 0) {
                document.getElementById("title").innerText = songTitle;
                updateBG(id);
            }
        } catch(e) {
            titlesCache[i] = `🎵 Track ${i+1}`;
            if (document.getElementById(`title-${i}`))
                document.getElementById(`title-${i}`).innerText = `Track ${i+1}`;
            if(i===0) document.getElementById("title").innerText = "School2k3 Relax";
        }
    }
}
function updateBG(id) {
    document.getElementById("bg").style.backgroundImage = `url('https://img.youtube.com/vi/${id}/maxresdefault.jpg')`;
}
function playVideo(index) {
    if (!player) return;
    player.loadVideoById(videos[index]);
    // active highlight
    document.querySelectorAll(".item").forEach(el => el.classList.remove("active"));
    const activeItem = document.getElementById(`item-${index}`);
    if (activeItem) activeItem.classList.add("active");
    // cập nhật title chính
    const newTitle = titlesCache[index] || `Bài hát ${index+1}`;
    document.getElementById("title").innerText = newTitle;
    updateBG(videos[index]);
}
function nextRandom() {
    let rand = Math.floor(Math.random() * videos.length);
    playVideo(rand);
}
// Youtube API
let tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);
function onYouTubeIframeAPIReady() {
    renderList();
    loadTitles().then(() => {
        // sau khi có title, cập nhật upcoming lần nữa
    });
    player = new YT.Player('player', {
        videoId: videos[0],
        playerVars: { autoplay: 1, rel: 0, modestbranding: 1 },
        events: {
            onStateChange: (e) => {
                if (e.data === YT.PlayerState.ENDED) nextRandom();
            }
        }
    });
}
// fallback background
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("bg").style.backgroundImage = "url('https://img.youtube.com/vi/6hNenqz0ISA/maxresdefault.jpg')";
});
</script>
</body>
</html>
