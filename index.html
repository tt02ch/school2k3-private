<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Góc chill của Trường</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    height: 100vh;
    color: #fff;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

/* Background blur */
.bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(90px) brightness(0.35) saturate(1.3);
    transform: scale(1.25);
    z-index: -2;
    transition: background-image 0.6s ease;
}
.bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.85) 100%);
    z-index: -1;
}

/* === VINYL DISC === */
.vinyl-container {
    display: flex;
    justify-content: center;
    padding: 20px 0 10px;
    opacity: 0.85;
}

.vinyl {
    width: 180px;
    height: 180px;
    background: radial-gradient(circle at 50% 50%, #222 0%, #111 40%, #000 70%, #333 100%);
    border-radius: 50%;
    position: relative;
    box-shadow: 
        0 15px 35px rgba(0,0,0,0.6),
        inset 0 0 40px rgba(255,255,255,0.08),
        0 0 30px rgba(255, 77, 77, 0.3);
    animation: spin 25s linear infinite paused;
}

.vinyl.playing {
    animation-play-state: running;
}

.vinyl::before {
    content: '';
    position: absolute;
    inset: 20px;
    background: #1a1a1a;
    border-radius: 50%;
    border: 2px solid #444;
}

.vinyl::after {
    content: '';
    position: absolute;
    inset: 45%;
    background: #ff4d4d;
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,77,77,0.6);
}

/* Label */
.vinyl-label {
    position: absolute;
    inset: 32%;
    background: linear-gradient(135deg, #ff4d4d, #ff9494);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 11px;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    border: 3px solid rgba(255,255,255,0.2);
}

/* Navbar */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: rgba(8, 8, 12, 0.85);
    backdrop-filter: blur(24px);
    border-bottom: 1px solid rgba(255, 77, 77, 0.3);
    display: flex;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
    gap: 16px;
}
.logo {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #ff4d4d, #ff9494);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.title-nav {
    font-size: 16px;
    opacity: 0.8;
    font-weight: 500;
}
.btn {
    background: rgba(255, 77, 77, 0.12);
    border: 1px solid rgba(255, 77, 77, 0.4);
    color: white;
    border-radius: 40px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}
.btn:hover {
    background: #ff4d4d;
    border-color: #ff4d4d;
    transform: scale(1.02);
}

/* Container */
.container {
    display: flex;
    max-width: 1600px;
    margin: 0 auto;
    height: 100vh;
    padding: 80px 24px 24px;
    gap: 24px;
}

/* LEFT */
.left {
    flex: 2.2;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
}
.player-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    background: #000;
}
.info-area {
    padding: 0 6px;
}
.main-title {
    font-size: clamp(20px, 2.5vw, 28px);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.signature {
    font-size: 12px;
    color: #ff8a8a;
    letter-spacing: 1px;
    opacity: 0.7;
}

/* RIGHT */
.right {
    flex: 1.35;
    min-width: 340px;
    height:100%;
    background: rgba(20, 20, 28, 0.55);
    backdrop-filter: blur(24px);
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.playlist-header {
    padding: 18px 22px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
}
.playlist-header::before {
    content: '';
    width: 6px;
    height: 6px;
    background: #ff4d4d;
    border-radius: 50%;
}

#list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 8px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
#list::-webkit-scrollbar {
    width: 5px;
}
#list::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
}
#list::-webkit-scrollbar-thumb {
    background: #ff4d4d;
    border-radius: 10px;
}
#list {
    scrollbar-width: thin;
    scrollbar-color: #ff4d4d rgba(255,255,255,0.1);
}

.item {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 16px;
    background: rgba(10,10,14,0.3);
    border: 1px solid transparent;
}
.item:hover {
    background: rgba(255, 77, 77, 0.15);
    transform: translateX(4px);
}
.item.active {
    background: linear-gradient(95deg, rgba(255,77,77,0.25), rgba(255,100,100,0.1));
    border-left: 3px solid #ff4d4d;
}
.thumb {
    width: 100px;
    height: 60px;
    border-radius: 12px;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
}
.controls {
    padding: 14px 20px 20px;
    border-top: 1px solid rgba(255,255,255,0.07);
}
.controls .btn {
    width: 100%;
    padding: 10px;
}

/* Animation */
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Responsive */
@media (max-width: 768px) {
    body {
        overflow-y: auto;
    }
    .container {
        flex-direction: column;
        height: auto;
        padding: 75px 16px 20px;
    }
    .right {
        width: 100%;
        max-height: 420px;
    }
    .vinyl-container {
        display: none; /* Ẩn trên mobile như yêu cầu */
    }
    .thumb {
        width: 80px;
        height: 48px;
    }
}
</style>
</head>
<body>
<div id="bg" class="bg"></div>

<nav class="navbar">
    <div class="logo">SCHOOL2K3</div>
    <div class="title-nav">Chill Player</div>
    <div style="margin-left:auto">
        <button class="btn" onclick="nextRandom()">🎲 Random</button>
    </div>
</nav>

<div class="container">
    <!-- LEFT -->
    <div class="left">
        <div id="player" class="player-frame"></div>
        
        <div class="info-area">
            <div id="title" class="main-title">Loading...</div>
            <div class="signature">SCHOOL2K3 • PRIVATE CHILL SPACE</div>
        </div>

        <!-- Đĩa nhạc quay -->
        <div class="vinyl-container">
            <div id="vinyl" class="vinyl">
                <div class="vinyl-label">CHILL</div>
            </div>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right">
        <div class="playlist-header">
            📀 Danh sách phát • Chill Vibes
        </div>
        <div id="list"></div>
        <div class="controls">
            <button class="btn" onclick="nextRandom()">🎲 Phát ngẫu nhiên tiếp theo</button>
        </div>
    </div>
</div>

<script>
// ... (giữ nguyên toàn bộ script cũ của bạn) ...

// Thêm chức năng quay đĩa theo trạng thái player
function updateVinyl(isPlaying) {
    const vinyl = document.getElementById('vinyl');
    if (isPlaying) {
        vinyl.classList.add('playing');
    } else {
        vinyl.classList.remove('playing');
    }
}

// Cập nhật trong onYouTubeIframeAPIReady và onStateChange
function onYouTubeIframeAPIReady() {
    renderList();
    loadTitles();

    player = new YT.Player('player', {
        videoId: videos[0],
        playerVars: { autoplay: 1, rel: 0, modestbranding: 1 },
        events: {
            onStateChange: (e) => {
                if (e.data === YT.PlayerState.PLAYING) {
                    updateVinyl(true);
                } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
                    updateVinyl(false);
                }
                if (e.data === YT.PlayerState.ENDED) nextRandom();
            }
        }
    });
}

// Khởi động đĩa khi load
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("bg").style.backgroundImage = "url('https://img.youtube.com/vi/6hNenqz0ISA/maxresdefault.jpg')";
    // Bắt đầu quay nhẹ khi load
    setTimeout(() => {
        document.getElementById('vinyl').classList.add('playing');
    }, 800);
});
</script>
</body>
</html>
